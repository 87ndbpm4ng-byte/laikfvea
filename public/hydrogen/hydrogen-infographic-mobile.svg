<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 420 1400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Laikfvea hydrogen water infographic</title>
  <desc id="desc">A mobile three-part explanation of dissolved molecular hydrogen, diffusion, and PEM SPE separation.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&amp;display=swap');
      .text { font-family: "Montserrat", sans-serif; fill: #171717; }
      .heading { font-weight: 600; font-size: 24px; letter-spacing: -.35px; }
      .body { font-weight: 400; font-size: 14px; fill: #51575B; }
      .label { font-weight: 400; font-size: 13px; fill: #242424; }
      .note { font-weight: 400; font-size: 11.5px; fill: #727272; }
      .chem { font-weight: 400; font-size: 17px; fill: #303030; }
      .line { fill: none; stroke: #343434; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .fine { fill: none; stroke: #A8A8A8; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .blue { fill: none; stroke: #52AEE8; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .blue-text { font-family: "Montserrat", sans-serif; font-weight: 400; fill: #52AEE8; }
      .dot { fill: #282828; }
    </style>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#52AEE8"/>
    </marker>
    <marker id="arrow-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#777"/>
    </marker>
  </defs>

  <!-- 1. More than water -->
  <text class="text heading" x="32" y="52">More than H<tspan baseline-shift="sub" font-size="16">2</tspan>O</text>

  <g transform="translate(67 91) scale(.72)" aria-label="Regular water glass">
    <path class="line" d="M0 14C0 5 25 0 57 0S114 5 114 14L104 174C104 183 84 188 57 188S10 183 10 174Z"/>
    <ellipse class="line" cx="57" cy="14" rx="57" ry="11"/>
    <path class="line" d="M6 53C20 57 38 59 57 59S94 57 108 53"/>
    <path class="fine" d="M10 174C24 179 40 181 57 181S90 179 104 174"/>
    <text class="text chem" x="57" y="111" text-anchor="middle">H<tspan baseline-shift="sub" font-size="11">2</tspan>O</text>
  </g>
  <text class="text label" x="108" y="248" text-anchor="middle">Regular water</text>

  <g transform="translate(271 91) scale(.72)" aria-label="Hydrogen water glass">
    <path class="line" d="M0 14C0 5 25 0 57 0S114 5 114 14L104 174C104 183 84 188 57 188S10 183 10 174Z"/>
    <ellipse class="line" cx="57" cy="14" rx="57" ry="11"/>
    <path class="line" d="M6 53C20 57 38 59 57 59S94 57 108 53"/>
    <path class="fine" d="M10 174C24 179 40 181 57 181S90 179 104 174"/>
    <text class="text chem" x="46" y="100" text-anchor="middle">H<tspan baseline-shift="sub" font-size="11">2</tspan>O</text>
    <g class="blue-text" font-size="12" text-anchor="middle">
      <circle class="blue" cx="88" cy="76" r="12"/><text x="88" y="80">H<tspan baseline-shift="sub" font-size="8">2</tspan></text>
      <circle class="blue" cx="78" cy="119" r="12"/><text x="78" y="123">H<tspan baseline-shift="sub" font-size="8">2</tspan></text>
      <circle class="blue" cx="31" cy="138" r="12"/><text x="31" y="142">H<tspan baseline-shift="sub" font-size="8">2</tspan></text>
      <circle class="blue" cx="69" cy="162" r="12"/><text x="69" y="166">H<tspan baseline-shift="sub" font-size="8">2</tspan></text>
    </g>
  </g>
  <text class="text label" x="312" y="248" text-anchor="middle">Hydrogen water</text>

  <text class="text body" x="32" y="302">
    <tspan x="32" dy="0">Hydrogen water contains additional molecular</tspan>
    <tspan x="32" dy="21">hydrogen dissolved in ordinary drinking water.</tspan>
  </text>

  <path class="fine" d="M32 382H388"/>
  <path class="blue" d="M210 362V402M199 391L210 402L221 391"/>

  <!-- 2. Small and mobile -->
  <text class="text heading" x="32" y="450">Small and mobile</text>

  <g aria-label="Molecular hydrogen diffusion">
    <circle class="blue" cx="58" cy="572" r="20"/>
    <text class="blue-text" x="58" y="578" font-size="18" text-anchor="middle">H<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <path class="blue" d="M87 572H126" marker-end="url(#arrow-blue)"/>

    <path class="line" d="M149 502C133 535 134 568 147 598C160 628 159 659 143 690"/>
    <path class="line" d="M183 502C167 535 168 568 181 598C194 628 193 659 177 690"/>
    <g fill="#8B8B8B">
      <circle cx="155" cy="517" r="1.3"/><circle cx="150" cy="534" r="1.3"/><circle cx="147" cy="551" r="1.3"/>
      <circle cx="147" cy="568" r="1.3"/><circle cx="151" cy="587" r="1.3"/><circle cx="158" cy="606" r="1.3"/>
      <circle cx="164" cy="626" r="1.3"/><circle cx="165" cy="647" r="1.3"/><circle cx="160" cy="670" r="1.3"/>
      <circle cx="189" cy="517" r="1.3"/><circle cx="184" cy="534" r="1.3"/><circle cx="181" cy="551" r="1.3"/>
      <circle cx="181" cy="568" r="1.3"/><circle cx="185" cy="587" r="1.3"/><circle cx="192" cy="606" r="1.3"/>
      <circle cx="198" cy="626" r="1.3"/><circle cx="199" cy="647" r="1.3"/><circle cx="194" cy="670" r="1.3"/>
    </g>

    <path class="blue" d="M205 572H244" marker-end="url(#arrow-blue)"/>
    <circle class="line" cx="316" cy="572" r="52"/>
    <circle class="line" cx="316" cy="572" r="37"/>
    <circle class="line" cx="316" cy="572" r="23"/>
    <circle class="dot" cx="316" cy="572" r="7"/>
  </g>

  <text class="text body" x="32" y="745">
    <tspan x="32" dy="0">Its tiny, neutral molecules can diffuse broadly</tspan>
    <tspan x="32" dy="21">through the body.</tspan>
  </text>

  <path class="fine" d="M32 825H388"/>
  <path class="blue" d="M210 805V845M199 834L210 845L221 834"/>

  <!-- 3. Clean separation -->
  <text class="text heading" x="32" y="893">Clean separation</text>

  <g transform="translate(37 940)" aria-label="PEM SPE separation">
    <path class="line" d="M35 105H315V121H35Z"/>
    <rect class="line" x="35" y="121" width="280" height="65" rx="2"/>
    <path class="line" d="M35 186H315V204H35Z"/>
    <path class="fine" d="M35 80C75 69 108 91 143 80S212 69 247 80S284 91 315 80"/>

    <g fill="#565656">
      <circle cx="54" cy="137" r="1.5"/><circle cx="77" cy="151" r="1.5"/><circle cx="98" cy="134" r="1.5"/>
      <circle cx="121" cy="166" r="1.5"/><circle cx="143" cy="143" r="1.5"/><circle cx="167" cy="173" r="1.5"/>
      <circle cx="191" cy="136" r="1.5"/><circle cx="214" cy="156" r="1.5"/><circle cx="235" cy="173" r="1.5"/>
      <circle cx="258" cy="141" r="1.5"/><circle cx="281" cy="165" r="1.5"/><circle cx="301" cy="137" r="1.5"/>
    </g>

    <g class="blue">
      <path d="M87 121V43" marker-end="url(#arrow-blue)"/>
      <path d="M146 121V43" marker-end="url(#arrow-blue)"/>
      <path d="M205 121V43" marker-end="url(#arrow-blue)"/>
      <path d="M264 121V43" marker-end="url(#arrow-blue)"/>
    </g>
    <g class="blue-text" font-size="17" text-anchor="middle">
      <text x="87" y="27">H<tspan baseline-shift="sub" font-size="10">2</tspan></text>
      <text x="146" y="27">H<tspan baseline-shift="sub" font-size="10">2</tspan></text>
      <text x="205" y="27">H<tspan baseline-shift="sub" font-size="10">2</tspan></text>
      <text x="264" y="27">H<tspan baseline-shift="sub" font-size="10">2</tspan></text>
    </g>

    <path d="M315 154H326V145H340" fill="none" stroke="#777" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arrow-grey)"/>
    <text class="text chem" x="349" y="152">O<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  </g>

  <text class="text body" x="32" y="1204">
    <tspan x="32" dy="0">PEM / SPE technology guides hydrogen into the</tspan>
    <tspan x="32" dy="21">water while unwanted gases leave separately.</tspan>
  </text>

  <path class="fine" d="M32 1300H104M316 1300H388"/>
  <text class="text note" x="210" y="1297" text-anchor="middle">
    <tspan x="210" dy="0">Research into molecular hydrogen</tspan>
    <tspan x="210" dy="17">and everyday wellness is ongoing.</tspan>
  </text>
</svg>
